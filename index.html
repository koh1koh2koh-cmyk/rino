<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>بياناتي</title>
  <style>
h1 {
  color: white;
  background: blue;
  padding: 20px;
  text-align: center;
  border-radius: 10px;
}
p {
  font-size: 20px;
  text-align: center;
  margin: 10px;
}
input {
  padding: 10px;
  font-size: 18px;
  border-radius: 5px;
  margin: 10px;
}
button {
  background: green;
  color: white;
  padding: 12px;
  border-radius: 5px;
}
  </style>
</head>
<body>
<h1>أدخل بياناتك</h1><p id="r1"></p><input placeholder="اكتب اسمك هنا" id="r2"><p id="r3"></p><input placeholder="اكتب عمرك هنا" id="r4"><p id="r5"></p><div id="r6"></div>  <script>

function عدد(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function نص(v) { return String(v); }

const حالة = new Proxy({  اسمي: "",
  عمري: 0,
}, {
  set(target, key, value) {
    target[key] = value;
    updateAll();
    return true;
  }
});

document.getElementById('r2').addEventListener('change', function() {
  حالة.اسمي = this.value;
});
document.getElementById('r4').addEventListener('change', function() {
  حالة.عمري = عدد(this.value);
});


function updateAll() {
  document.getElementById('r1').textContent = ("اسمك: " + حالة.اسمي);
  document.getElementById('r3').textContent = ("عمرك: " + حالة.عمري);
  document.getElementById('r5').textContent = ((("اسمك: " + حالة.اسمي) + " — عمرك: ") + حالة.عمري);
  { const _c = (حالة.عمري > 18); const _e = document.getElementById('r6'); if (_e) _e.innerHTML = _c ? `<p>أنت بالغ ✓</p>` : `<p>أنت قاصر</p>`; }
}

updateAll();

  </script>
</body>
</html>
