<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>قائمة مهامي</title>
  <style>
h1 {
  color: white;
  background: blue;
  padding: 20px;
  text-align: center;
  border-radius: 10px;
}
input {
  padding: 10px;
  font-size: 16px;
  border-radius: 5px;
  margin: 5px;
  width: 300px;
}
button {
  background: green;
  color: white;
  padding: 10px;
  border-radius: 5px;
  margin: 5px;
}
p {
  font-size: 18px;
  text-align: center;
  margin: 15px;
}
  </style>
</head>
<body>
<h1>قائمة مهامي</h1><p>اكتب مهمة، ثم اضغط أضف</p><p>انقر على المهمة لحذفها</p><input placeholder="اكتب مهمة جديدة" id="حقل_المهمة"><button id="r1">أضف</button><button id="r2">امسح الكل</button><ul id="مهامي"></ul>  <script>

function عدد(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function نص(v) { return String(v); }
function اقرأ(id) {
  const el = document.getElementById(id);
  return el ? el.value : "";
}
function امسح(id) {
  const el = document.getElementById(id);
  if (el) el.innerHTML = "";
}
function أضف_مهمة(id_قائمة, نص) {
  const ul = document.getElementById(id_قائمة);
  if (!ul) return;
  const li = document.createElement("li");
  li.textContent = نص;
  li.style.padding = "10px";
  li.style.marginTop = "5px";
  li.style.background = "rgb(240, 240, 240)";
  li.style.borderRadius = "5px";
  li.style.cursor = "pointer";
  li.title = "انقر للحذف";
  li.onclick = function() { li.remove(); };
  ul.appendChild(li);
}
document.getElementById('r1').addEventListener('click', function() {
  أضف_مهمة("مهامي", اقرأ("حقل_المهمة"));
});
document.getElementById('r2').addEventListener('click', function() {
  امسح("مهامي");
});

  </script>
</body>
</html>
